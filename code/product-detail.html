<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết sản phẩm | Sebastian Sportwear</title>
<meta name="description" content="Thông tin chi tiết, kích cỡ và hướng dẫn sử dụng sản phẩm.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="detail">
<div id="site-header"></div>

<main class="section pt-4"><div class="container" id="detail"></div></main>
<div class="modal fade" id="sizeModal" tabindex="-1" aria-labelledby="sizeTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="sizeTitle">Bảng kích cỡ</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
  <div class="modal-body"><table class="table table-sm text-center"><thead><tr><th>Size</th><th>Ngực (cm)</th><th>Eo (cm)</th><th>Cân nặng (kg)</th></tr></thead>
  <tbody><tr><td>S</td><td>88 - 92</td><td>70 - 74</td><td>50 - 58</td></tr><tr><td>M</td><td>92 - 96</td><td>74 - 78</td><td>58 - 66</td></tr><tr><td>L</td><td>96 - 100</td><td>78 - 83</td><td>66 - 75</td></tr><tr><td>XL</td><td>100 - 106</td><td>83 - 90</td><td>75 - 85</td></tr></tbody></table>
  <p class="text-muted-sw mb-0 small">Số đo mang tính tham khảo. Nếu nằm giữa hai size, nên chọn size lớn hơn khi thích mặc rộng.</p></div></div></div></div>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>

const p = getP(qs('id')) || PRODUCTS[0];
const isAcc = p.group === 'phukien';
let color = p.colors[0], size = p.sizes.length === 1 ? p.sizes[0] : '';
const related = isAcc ? PRODUCTS.filter((x) => x.group === 'nam').slice(0, 4) : PRODUCTS.filter((x) => x.group === 'phukien').slice(0, 4);
const specs = isAcc ? [['Loại', p.cat], ['Kích thước', p.spec], ['Chất liệu', p.mat]] : [['Loại', p.cat], ['Chất liệu', p.mat], ['Giặt', 'Giặt máy ở 30°C, không dùng chất tẩy']];
const reviews = [['Minh Khoa', 5, 'Mặc rất thoải mái, đúng size như bảng.'], ['Thu Hà', 4, 'Chất liệu ổn, giao hàng nhanh.']];
$('#detail').html(`
<div class="crumb"><a href="index.html">Trang chủ</a> / <a href="products.html?group=${p.group}">${isAcc ? 'Phụ kiện tập' : p.group === 'nam' ? 'Đồ nam' : 'Đồ nữ'}</a> / ${p.name}</div>
<div class="row g-5">
  <div class="col-md-6"><div class="detail-img" style="background:${p.bg}"><img src="img/${p.icon}.svg" alt="${p.name}"></div></div>
  <div class="col-md-6">
    <div class="text-muted-sw">${p.cat}</div><h2 class="mb-2" style="font-size:2.6rem">${p.name}</h2>
    <div class="fs-4 mb-3"><b>${money(p.price)}</b> ${p.old ? `<s class="price-old">${money(p.old)}</s>` : ''}</div>
    <p>${p.desc}</p>
    <div class="mb-3"><div class="fw-semibold mb-2">Màu: <span id="colorName">${COLORS[color].n}</span></div>
      <div class="d-flex gap-2" id="swatches">${p.colors.map((c, i) => `<button class="swatch ${i ? '' : 'on'}" data-c="${c}" style="background:${COLORS[c].c}" aria-label="${COLORS[c].n}"></button>`).join('')}</div></div>
    <div class="mb-3"><div class="d-flex justify-content-between"><span class="fw-semibold">Kích cỡ</span>${isAcc && p.cat !== 'Đai lưng' && p.cat !== 'Quấn gối' ? '' : '<a href="#" data-bs-toggle="modal" data-bs-target="#sizeModal" class="link-more small">Bảng kích cỡ</a>'}</div>
      <div class="d-flex gap-2 flex-wrap mt-2" id="sizes">${p.sizes.map((s) => `<button class="size-btn ${p.sizes.length === 1 ? 'on' : ''}" data-s="${s}">${s}</button>`).join('')}</div>
      <div class="text-danger small mt-2 d-none" id="sizeErr">Hãy chọn kích cỡ trước khi thêm vào giỏ.</div></div>
    <div class="d-flex gap-3 align-items-center mb-4">
      <div class="qty"><button id="minus" aria-label="Giảm">-</button><input id="qty" value="1" aria-label="Số lượng" readonly><button id="plus" aria-label="Tăng">+</button></div>
      <button class="btn btn-sw flex-grow-1" id="addCart">Thêm vào giỏ hàng</button>
    </div>
    <div class="text-muted-sw small">Còn hàng. Giao toàn quốc, đổi size trong 7 ngày.</div>
  </div>
</div>
<div class="mt-5">
  <ul class="nav nav-tabs" role="tablist"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tInfo">Thông tin</button></li>
    ${isAcc ? '<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tUse">Hướng dẫn sử dụng</button></li>' : ''}
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tRev">Đánh giá</button></li></ul>
  <div class="tab-content pt-3">
    <div class="tab-pane fade show active" id="tInfo"><ul class="spec-list">${specs.map((s) => `<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join('')}</ul></div>
    ${isAcc ? `<div class="tab-pane fade" id="tUse"><ol class="use-steps">${p.use.map((u) => `<li>${u}</li>`).join('')}</ol></div>` : ''}
    <div class="tab-pane fade" id="tRev">${reviews.map((r) => `<div class="mb-3"><div class="stars">${'★'.repeat(r[1])}${'☆'.repeat(5 - r[1])}</div><b>${r[0]}</b><div>${r[2]}</div></div>`).join('')}</div>
  </div>
</div>
<div class="mt-5"><div class="section-head"><h2>${isAcc ? 'Mặc cùng' : 'Mua kèm phụ kiện'}</h2></div><div class="row g-3 g-md-4">${related.map(productCard).join('')}</div></div>`);
document.title = p.name + ' | Sebastian Sportwear';
$('#swatches').on('click', '.swatch', function () { color = $(this).data('c'); $('.swatch').removeClass('on'); $(this).addClass('on'); $('#colorName').text(COLORS[color].n); });
$('#sizes').on('click', '.size-btn', function () { size = $(this).data('s'); $('.size-btn').removeClass('on'); $(this).addClass('on'); $('#sizeErr').addClass('d-none'); });
$('#minus').on('click', () => $('#qty').val(Math.max(1, +$('#qty').val() - 1)));
$('#plus').on('click', () => $('#qty').val(Math.min(20, +$('#qty').val() + 1)));
$('#addCart').on('click', () => { if (!size) { $('#sizeErr').removeClass('d-none'); return; } Cart.add(p.id, size, color, +$('#qty').val()); toast('Đã thêm vào giỏ hàng'); });

</script>
</body>
</html>
