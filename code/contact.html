<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liên hệ | Sebastian Sportwear</title>
<meta name="description" content="Liên hệ cửa hàng Sebastian Sportwear.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="contact">
<div id="site-header"></div>
<section class="page-head"><div class="container"><div class="crumb"><a href="index.html">Trang chủ</a> / Liên hệ</div><h1>Liên hệ</h1></div></section>
<main class="section"><div class="container"><div class="row g-5">
  <div class="col-lg-5"><h4>Thông tin cửa hàng</h4>
    <ul class="spec-list"><li><b>Địa chỉ</b><span>Hưng Yên, Việt Nam</span></li><li><b>Hotline</b><span>0900 000 000</span></li><li><b>Email</b><span>hello@sebastiansportwear.vn</span></li><li><b>Giờ làm việc</b><span>8:00 - 21:00 hằng ngày</span></li></ul></div>
  <div class="col-lg-7"><form class="needs-validation" id="ctForm" novalidate>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="cn">Họ và tên</label><input class="form-control" id="cn" required><div class="invalid-feedback">Nhập họ và tên.</div></div>
      <div class="col-md-6"><label class="form-label" for="ce">Email</label><input type="email" class="form-control" id="ce" required><div class="invalid-feedback">Nhập email hợp lệ.</div></div>
      <div class="col-12"><label class="form-label" for="cm">Nội dung</label><textarea class="form-control" id="cm" rows="5" required></textarea><div class="invalid-feedback">Nhập nội dung cần hỗ trợ.</div></div>
      <div class="col-12"><button class="btn btn-sw">Gửi liên hệ</button></div>
    </div></form></div>
</div></div></main>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>

$('#ctForm').on('submit', function (e) { e.preventDefault(); if (!this.checkValidity()) { $(this).addClass('was-validated'); return; } toast('Đã gửi liên hệ, chúng tôi sẽ phản hồi sớm'); this.reset(); $(this).removeClass('was-validated'); });

</script>
</body>
</html>
