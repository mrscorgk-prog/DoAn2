<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thống kê, báo cáo | Quản trị Sebastian Sportwear</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body class="admin" data-page="reports">
<div id="a-shell"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="admin-data.js"></script>
<script src="admin.js"></script>
<script>
adminShell('reports','Thống kê, báo cáo'); if ($('#a-content').length) {

const m = Math.max(...ADMIN_DATA.revenue6m.map((r) => r[1]));
const top = [[9, 128], [4, 96], [1, 87], [6, 64], [10, 52]];
const lows = PRODUCTS.filter((p) => stock[p.id] <= 10).sort((a, b) => stock[a.id] - stock[b.id]);
$('#a-content').html(`<div class="row g-3"><div class="col-lg-7"><div class="a-card"><h4>Doanh thu 6 tháng gần nhất (triệu đồng)</h4><div class="bars mt-4">${ADMIN_DATA.revenue6m.map((r) => `<div class="bar" style="height:${r[1] / m * 100}%"><span>${r[1]}</span></div>`).join('')}</div>
<div class="bar-labels">${ADMIN_DATA.revenue6m.map((r) => `<div>${r[0]}</div>`).join('')}</div></div></div>
<div class="col-lg-5"><div class="a-card"><h4>Sản phẩm bán chạy (số lượng)</h4><ul class="rank">${top.map(([id, n]) => `<li><span>${getP(id).name}</span><b>${n}</b></li>`).join('')}</ul></div></div>
<div class="col-12"><div class="a-card"><h4>Sản phẩm sắp hết hàng (tồn từ 10 trở xuống)</h4><ul class="rank">${lows.map((p) => `<li><span>${p.name} <small class="text-muted-sw">${p.cat}</small></span><b class="text-danger">Còn ${stock[p.id]}</b></li>`).join('')}</ul></div></div></div>`);

}
</script>
</body>
</html>
