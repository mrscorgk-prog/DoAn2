<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý khách hàng | Quản trị Sebastian Sportwear</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body class="admin" data-page="customers">
<div id="a-shell"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="admin-data.js"></script>
<script src="admin.js"></script>
<script>
adminShell('customers','Quản lý khách hàng'); if ($('#a-content').length) {

crudTable({ name: 'customers', addLabel: 'Thêm khách hàng', data: ADMIN_DATA.customers,
  cols: [{ k: 'ten', l: 'Họ tên' }, { k: 'email', l: 'Email' }, { k: 'sdt', l: 'Điện thoại' }, { k: 'ngay', l: 'Ngày đăng ký' }, { l: 'Trạng thái', f: (r) => `<span class="badge-s ${r.tt === 'Hoạt động' ? 's-xong' : 's-huy'}">${r.tt}</span>` }],
  fields: [{ k: 'ten', l: 'Họ tên' }, { k: 'email', l: 'Email', t: 'email' }, { k: 'sdt', l: 'Điện thoại' }, { k: 'ngay', l: 'Ngày đăng ký' }, { k: 'tt', l: 'Trạng thái', t: 'select', opts: ['Hoạt động', 'Đã khóa'] }] });

}
</script>
</body>
</html>
