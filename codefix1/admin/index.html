<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tổng quan | Quản trị Sebastian Sportwear</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body class="admin" data-page="dash">
<div id="a-shell"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="admin-data.js"></script>
<script src="admin.js"></script>
<script>
adminShell('dash','Tổng quan'); if ($('#a-content').length) {

const orders = store.get('orders', ADMIN_DATA.orders), ok = orders.filter((o) => o.st !== 'huy');
const rev = ok.reduce((s, o) => s + orderTotal(o), 0), low = PRODUCTS.filter((p) => stock[p.id] <= 10).length, max = Math.max(...ADMIN_DATA.revenue7.map((r) => r[1]));
$('#a-content').html(`<div class="row g-3 mb-4">
 <div class="col-6 col-xl-3"><div class="a-card stat"><b>${money(rev)}</b><span>Doanh thu đơn hợp lệ</span></div></div>
 <div class="col-6 col-xl-3"><div class="a-card stat"><b>${orders.length}</b><span>Tổng số đơn hàng</span></div></div>
 <div class="col-6 col-xl-3"><div class="a-card stat"><b>${ADMIN_DATA.customers.length}</b><span>Khách hàng</span></div></div>
 <div class="col-6 col-xl-3"><div class="a-card stat warn"><b>${low}</b><span>Sản phẩm sắp hết hàng</span></div></div></div>
<div class="row g-3"><div class="col-lg-7"><div class="a-card"><h4>Doanh thu 7 ngày qua (triệu đồng)</h4><div class="bars mt-4">${ADMIN_DATA.revenue7.map((r) => `<div class="bar" style="height:${r[1] / max * 100}%"><span>${r[1]}</span></div>`).join('')}</div>
 <div class="bar-labels">${ADMIN_DATA.revenue7.map((r) => `<div>${r[0]}</div>`).join('')}</div></div></div>
 <div class="col-lg-5"><div class="a-card"><h4>Đơn hàng mới nhất</h4><ul class="rank">${orders.slice(0, 5).map((o) => `<li><span><b>${o.id}</b><br><small class="text-muted-sw">${o.kh}</small></span><span class="text-end">${money(orderTotal(o))}<br>${stBadge(o.st)}</span></li>`).join('')}</ul><a class="link-more small" href="orders.html">Xem tất cả đơn</a></div></div></div>`);

}
</script>
</body>
</html>
