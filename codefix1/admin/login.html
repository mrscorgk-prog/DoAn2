<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập | Quản trị Sebastian Sportwear</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body class="admin" data-page="login">
<div class="login-wrap"><form class="login-box" id="lf">
<div class="brand mb-3"><span class="brand-main">Sebastian</span><span class="brand-sub">Admin</span></div>
<h2 class="mb-3" style="font-size:1.8rem">Đăng nhập quản trị</h2>
<div class="mb-3"><label class="form-label" for="em">Email</label><input class="form-control" id="em" type="email" required></div>
<div class="mb-3"><label class="form-label" for="pw">Mật khẩu</label><input class="form-control" id="pw" type="password" required></div>
<div class="alert alert-danger py-2 d-none" id="err" role="alert">Email hoặc mật khẩu chưa đúng.</div>
<button class="btn btn-sw w-100">Đăng nhập</button>
<p class="small text-muted-sw mt-3 mb-0">Tài khoản thử: admin@sebastian.vn / admin123</p></form></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="admin-data.js"></script>
<script src="admin.js"></script>
<script>

if (sessionStorage.getItem(AUTH_KEY)) location.href = 'index.html';
$('#lf').on('submit', function (e) {
  e.preventDefault();
  if ($('#em').val().trim() === 'admin@sebastian.vn' && $('#pw').val() === 'admin123') { sessionStorage.setItem(AUTH_KEY, '1'); location.href = 'index.html'; }
  else { $('#err').removeClass('d-none'); }
});
</script>
</body>
</html>
