<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý khuyến mãi | Quản trị Sebastian Sportwear</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body class="admin" data-page="promos">
<div id="a-shell"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="admin-data.js"></script>
<script src="admin.js"></script>
<script>
adminShell('promos','Quản lý khuyến mãi'); if ($('#a-content').length) {

crudTable({ name: 'promos', addLabel: 'Thêm mã giảm giá', data: ADMIN_DATA.promos,
  cols: [{ k: 'code', l: 'Mã' }, { l: 'Giảm', f: (r) => r.giam + '%' }, { k: 'bd', l: 'Bắt đầu' }, { k: 'kt', l: 'Kết thúc' }],
  fields: [{ k: 'code', l: 'Mã giảm giá' }, { k: 'giam', l: 'Phần trăm giảm', t: 'number' }, { k: 'bd', l: 'Ngày bắt đầu', t: 'date' }, { k: 'kt', l: 'Ngày kết thúc', t: 'date' }] });

}
</script>
</body>
</html>
