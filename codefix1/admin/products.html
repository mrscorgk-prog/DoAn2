<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý sản phẩm | Quản trị Sebastian Sportwear</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body class="admin" data-page="products">
<div id="a-shell"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="admin-data.js"></script>
<script src="admin.js"></script>
<script>
adminShell('products','Quản lý sản phẩm'); if ($('#a-content').length) {

crudTable({ name: 'products', addLabel: 'Thêm sản phẩm',
  data: PRODUCTS.map((p) => ({ id: p.id, ten: p.name, dm: p.cat, gia: p.price, ton: stock[p.id], chatlieu: p.mat, mota: p.desc, icon: p.icon, bg: p.bg })),
  cols: [{ l: 'Ảnh', f: (r) => `<div class="thumb" style="background:${r.bg || '#D6DCE4'}"><img src="../img/${r.icon || 'tee'}.svg" alt=""></div>` }, { k: 'ten', l: 'Tên sản phẩm' }, { k: 'dm', l: 'Danh mục' },
    { l: 'Giá', f: (r) => money(r.gia) }, { l: 'Tồn kho', f: (r) => r.ton <= 10 ? `<b class="text-danger">${r.ton} (sắp hết)</b>` : r.ton }],
  fields: [{ k: 'ten', l: 'Tên sản phẩm' }, { k: 'dm', l: 'Danh mục', t: 'select', opts: ADMIN_DATA.categories.map((c) => c.ten) }, { k: 'gia', l: 'Giá bán (VNĐ)', t: 'number' },
    { k: 'ton', l: 'Số lượng tồn', t: 'number' }, { k: 'chatlieu', l: 'Chất liệu' }, { k: 'mota', l: 'Mô tả', t: 'textarea', req: false }] });

}
</script>
</body>
</html>
