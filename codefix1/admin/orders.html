<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý đơn hàng | Quản trị Sebastian Sportwear</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body class="admin" data-page="orders">
<div id="a-shell"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="admin-data.js"></script>
<script src="admin.js"></script>
<script>
adminShell('orders','Quản lý đơn hàng'); if ($('#a-content').length) {

let orders = store.get('orders', ADMIN_DATA.orders), filter = '', cur = null;
$('#a-content').html(`<div class="d-flex gap-2 mb-3 flex-wrap"><select class="form-select w-auto" id="of" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
<div class="table-responsive"><table class="a-table"><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th>Thanh toán</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody id="ob"></tbody></table></div>`);
const modalEl = $(`<div class="modal fade" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="om-t"></h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div><div class="modal-body" id="om-b"></div>
<div class="modal-footer"><select class="form-select w-auto" id="om-s" aria-label="Trạng thái">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><button class="btn btn-sw" id="om-save">Cập nhật trạng thái</button></div></div></div></div>`).appendTo('body');
const modal = new bootstrap.Modal(modalEl[0]);
function draw() {
  const l = orders.filter((o) => !filter || o.st === filter);
  $('#ob').html(l.map((o) => `<tr><td><b>${o.id}</b></td><td>${o.kh}<br><small class="text-muted-sw">${o.sdt}</small></td><td>${o.ngay}</td><td>${o.pay}</td><td>${money(orderTotal(o))}</td><td>${stBadge(o.st)}</td><td class="text-end"><button class="btn btn-ink btn-sm view" data-id="${o.id}">Chi tiết</button></td></tr>`).join('') || '<tr><td colspan="7" class="text-center py-4 text-muted-sw">Không có đơn hàng ở trạng thái này.</td></tr>');
}
$('#of').on('change', function () { filter = this.value; draw(); });
$('#ob').on('click', '.view', function () {
  cur = orders.find((o) => o.id === $(this).data('id')); $('#om-t').text('Đơn hàng ' + cur.id); $('#om-s').val(cur.st);
  $('#om-b').html(`<div class="row g-3 mb-3"><div class="col-md-6"><b>Khách hàng:</b> ${cur.kh}<br><b>Điện thoại:</b> ${cur.sdt}</div><div class="col-md-6"><b>Địa chỉ giao:</b> ${cur.dc}<br><b>Thanh toán:</b> ${cur.pay}</div></div>
  <table class="a-table"><thead><tr><th>Sản phẩm</th><th>Size</th><th>SL</th><th>Thành tiền</th></tr></thead><tbody>${cur.items.map(([id, s, q]) => `<tr><td>${getP(id).name}</td><td>${s}</td><td>${q}</td><td>${money(getP(id).price * q)}</td></tr>`).join('')}</tbody></table>
  <div class="text-end fs-5 mt-2"><b>Tổng: ${money(orderTotal(cur))}</b></div>`);
  modal.show();
});
$('#om-save').on('click', () => { cur.st = $('#om-s').val(); store.set('orders', orders); draw(); modal.hide(); toast('Đã cập nhật trạng thái'); });
draw();

}
</script>
</body>
</html>
