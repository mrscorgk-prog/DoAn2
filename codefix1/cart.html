<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giỏ hàng | Sebastian Sportwear</title>
<meta name="description" content="Giỏ hàng của bạn.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="cart">
<div id="site-header"></div>
<section class="page-head"><div class="container"><div class="crumb"><a href="index.html">Trang chủ</a> / Giỏ hàng</div><h1>Giỏ hàng</h1></div></section>
<main class="section"><div class="container"><div id="cartBox"></div></div></main>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>

function draw() {
  const items = Cart.all();
  if (!items.length) { $('#cartBox').html('<div class="empty-box">Giỏ hàng đang trống.<br><a class="btn btn-sw mt-3" href="products.html">Chọn sản phẩm</a></div>'); return; }
  const rows = items.map((it, i) => { const p = getP(it.id); return `<div class="cart-row">
    <a class="cart-thumb" href="product-detail.html?id=${p.id}" style="background:${p.bg}"><img src="img/${p.icon}.svg" alt=""></a>
    <div><a class="fw-semibold" href="product-detail.html?id=${p.id}">${p.name}</a><div class="text-muted-sw small">${COLORS[it.color].n}, ${it.size}</div>
      <div class="d-flex align-items-center gap-3 mt-2"><div class="qty"><button data-i="${i}" data-d="-1" aria-label="Giảm">-</button><input value="${it.qty}" readonly aria-label="Số lượng"><button data-i="${i}" data-d="1" aria-label="Tăng">+</button></div>
      <button class="btn btn-link text-muted-sw p-0 rm" data-i="${i}">Xóa</button></div></div>
    <div class="fw-bold">${money(p.price * it.qty)}</div></div>`; }).join('');
  $('#cartBox').html(`<div class="row g-5"><div class="col-lg-8">${rows}</div><div class="col-lg-4"><div class="summary">
    <h4>Tóm tắt đơn hàng</h4><div class="row-line"><span>Tạm tính</span><b>${money(Cart.total())}</b></div><div class="row-line"><span>Phí giao hàng</span><span>Tính ở bước thanh toán</span></div>
    <div class="row-line row-total"><span>Tổng</span><span>${money(Cart.total())}</span></div><a class="btn btn-sw w-100 mt-3" href="checkout.html">Thanh toán</a></div></div></div>`);
}
$('#cartBox').on('click', '.qty button', function () { const i = +$(this).data('i'); Cart.setQty(i, Cart.all()[i].qty + +$(this).data('d')); draw(); });
$('#cartBox').on('click', '.rm', function () { Cart.remove(+$(this).data('i')); draw(); });
draw();

</script>
</body>
</html>
