<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập | Sebastian Sportwear</title>
<meta name="description" content="Đăng nhập tài khoản Sebastian Sportwear.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
<div id="site-header"></div>
<section class="page-head"><div class="container"><div class="crumb"><a href="index.html">Trang chủ</a> / Đăng nhập</div><h1>Đăng nhập</h1></div></section>
<main class="section"><div class="container"><div class="row g-5"><div class="col-lg-5 d-none d-lg-block"><div class="auth-side"><h2>Tập đủ bộ, mua một lần</h2><p class="text-white-50">Đăng nhập để theo dõi đơn hàng, lưu sản phẩm yêu thích và thanh toán nhanh hơn.</p></div></div>
  <div class="col-lg-7"><form class="auth-wrap needs-validation" id="loginForm" novalidate>
    <div class="mb-3"><label class="form-label" for="em">Email</label><input type="email" class="form-control" id="em" required><div class="invalid-feedback">Nhập email hợp lệ.</div></div>
    <div class="mb-3"><label class="form-label" for="pw">Mật khẩu</label><input type="password" class="form-control" id="pw" minlength="6" required><div class="invalid-feedback">Mật khẩu tối thiểu 6 ký tự.</div></div>
    <button class="btn btn-sw w-100">Đăng nhập</button>
    <p class="mt-3 text-center">Chưa có tài khoản? <a class="link-more" href="register.html">Đăng ký</a></p>
  </form></div></div></div></main>
<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/layout.js"></script>
<script>

$('#loginForm').on('submit', function (e) { e.preventDefault(); if (!this.checkValidity()) { $(this).addClass('was-validated'); return; } toast('Đăng nhập thành công'); setTimeout(() => (location.href = 'index.html'), 900); });

</script>
</body>
</html>
